<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hash8 UI - Single Script Demo</title>

    <!-- 1. Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 2. Hash8 UI Standalone Build (Includes React, ReactDOM, Styles) -->
    <script src="./dist-standalone/hash8-ui.standalone.js"></script>

    <!-- Shim process -->
    <script>
        if (!window.process) window.process = { env: { NODE_ENV: 'production' } };
    </script>
    <!-- Development version -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div id="root"></div>

    <script type="text/babel">
        // 1. Destructure React, ReactDOM and H8 components
        const {
            React,
            ReactDOM,
            H8Button,
            H8Card,
            H8CardHeader,
            H8CardTitle,
            H8CardContent,
            H8Input,
            H8Label,
            H8Avatar,
            H8AvatarImage,
            H8AvatarFallback,
            H8Badge,
            H8Dialog,
            H8DialogTrigger,
            H8DialogContent,
            H8DialogHeader,
            H8DialogTitle,
            H8DialogDescription,
            H8DialogFooter,
            H8Tooltip,
            H8TooltipContent,
            H8TooltipProvider,
            H8TooltipTrigger,
            H8Accordion,
            H8AccordionContent,
            H8AccordionItem,
            H8AccordionTrigger,
            H8HoverCard,
            H8HoverCardContent,
            H8HoverCardTrigger,
            H8Alert,
            H8AlertDescription,
            H8AlertTitle,
            H8Checkbox,
            H8Separator,
        } = Hash8UI;

        // 2. Make React global so Babel's compiled JSX (React.createElement) works
        window.React = React;

        const App = () => {
            const [count, setCount] = React.useState(0);
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, []);

            return (
                <div className="w-full max-w-md space-y-4 font-sans">
                    <H8Card>
                        <H8CardHeader>
                            <H8CardTitle>Single Script Demo</H8CardTitle>
                        </H8CardHeader>
                        <H8CardContent className="space-y-4">
                            <div className="space-y-2">
                                <H8Label htmlFor="name">Name</H8Label>
                                <H8Input id="name" placeholder="Enter your name" />
                            </div>

                            <div className="flex items-center gap-4">
                                <H8Button onClick={() => setCount(c => c + 1)}>
                                    Count is: {count}
                                </H8Button>
                                <H8Button variant="secondary">
                                    Secondary
                                </H8Button>
                                <H8Button variant="destructive">
                                    Destructive
                                </H8Button>
                            </div>

                            <H8Avatar>
                                <H8AvatarImage src="https://github.com/shadcn.png" alt="@shadcn" />
                                <H8AvatarFallback>JD</H8AvatarFallback>
                            </H8Avatar>
                            <H8Badge variant="destructive">Destructive</H8Badge>
                            <p className="text-sm text-muted-foreground mt-4">
                                Using <code>Hash8UI.H8Card</code> etc.
                            </p>
                        </H8CardContent>
                    </H8Card>
                    <div className="flex justify-between">
                        <H8Dialog>
                            <H8DialogTrigger>
                                <H8Button variant="outline">Open Simple Dialog</H8Button>
                            </H8DialogTrigger>
                            <H8DialogContent>
                                <H8DialogHeader>
                                    <H8DialogTitle>Edit Profile</H8DialogTitle>
                                    <H8DialogDescription>Make changes to your profile here. Click save when you're done.</H8DialogDescription>
                                </H8DialogHeader>
                                <label htmlFor="email" className="text-sm font-medium">
                                    Email
                                </label>
                                <H8Input type="email" id="email" placeholder="Email" />
                                <label htmlFor="email" className="text-sm font-medium">
                                    Name
                                </label>
                                <H8Input type="email" id="email" placeholder="Name" />
                                <H8DialogFooter>
                                    <H8TooltipProvider>
                                        <H8Tooltip>
                                            <H8TooltipTrigger asChild>
                                                <H8Button>Save changes</H8Button>
                                            </H8TooltipTrigger>
                                            <H8TooltipContent side="top">
                                                <p>Save Changes</p>
                                            </H8TooltipContent>
                                        </H8Tooltip>
                                    </H8TooltipProvider>

                                </H8DialogFooter>
                            </H8DialogContent>
                        </H8Dialog>
                        <H8HoverCard>
                            <H8HoverCardTrigger asChild>
                                <H8Button variant="link">@nextjs</H8Button>
                            </H8HoverCardTrigger>
                            <H8HoverCardContent className="w-80">
                                <div className="flex justify-between gap-4">
                                    <H8Avatar>
                                        <H8AvatarImage src="https://github.com/vercel.png" />
                                        <H8AvatarFallback>VC</H8AvatarFallback>
                                    </H8Avatar>
                                    <div className="space-y-1">
                                        <h4 className="text-sm font-semibold">@nextjs</h4>
                                        <p className="text-sm">
                                            The React Framework – created and maintained by @vercel.
                                        </p>
                                        <div className="flex items-center pt-2">
                                            <span className="text-xs text-muted-foreground">
                                                Joined December 2021
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </H8HoverCardContent>
                        </H8HoverCard>

                    </div>
                    <H8Separator className="my-4" />
                    <H8Alert>
                        <i data-lucide="circle-check" className="h-4 w-4"></i>
                        <H8AlertTitle>Heads up!</H8AlertTitle>
                        <H8AlertDescription>
                            You can add components and dependencies to your project using the command line interface.
                        </H8AlertDescription>
                    </H8Alert>
                    <div className="flex items-start gap-3">
                        <H8Checkbox id="terms-2" defaultChecked />
                        <div className="grid gap-2">
                            <H8Label htmlFor="terms-2">Accept terms and conditions</H8Label>
                            <p className="text-muted-foreground text-sm">
                                By clicking this checkbox, you agree to the terms and conditions.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
